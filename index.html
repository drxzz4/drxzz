<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>𝚍𝚛𝚡𝚣𝚣</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #000000;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.09);
      --border-hover: rgba(255,255,255,0.22);
      --text: #f0f0f0;
      --muted: #555;
      --accent: #bf00ff;
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Raleway', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* subtle scanline */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(255,255,255,0.012) 2px,
        rgba(255,255,255,0.012) 4px
      );
      pointer-events: none;
      z-index: 0;
    }

    #bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      pointer-events: none;
    }
    #bg-video.hidden { display: none; }

    /* ══════════════════════════════════════
       SPLASH
    ══════════════════════════════════════ */
    #splash {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.8s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }

    .splash-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      text-align: center;
      padding: 0 24px;
      animation: splashFadeIn 2s ease both;
    }

    @keyframes splashFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .splash-hint {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      animation: splashBlink 2s ease-in-out infinite;
    }

    @keyframes splashBlink {
      0%, 100% { opacity: 0.25; }
      50%       { opacity: 0.7; }
    }

    /* ══════════════════════════════════════
       CARD
    ══════════════════════════════════════ */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ══════════════════════════════════════
       AVATAR
    ══════════════════════════════════════ */
    .avatar-wrap {
      position: relative;
      width: 100px;
      height: 100px;
      margin-bottom: 22px;
      cursor: pointer;
      animation: fadeUp 0.55s 0.05s cubic-bezier(0.22,1,0.36,1) both;
    }

    .avatar-ring {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1.5px solid var(--border-hover);
      overflow: hidden;
      transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-wrap:hover .avatar-ring {
      border-color: rgba(255,255,255,0.55);
      box-shadow: 0 0 24px rgba(191,0,255,0.25);
      transform: scale(1.04);
    }

    #avatar-img { width: 100%; height: 100%; object-fit: cover; display: none; }

    .avatar-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      transition: color 0.25s;
      pointer-events: none;
    }
    .avatar-wrap:hover .avatar-placeholder { color: #888; }
    .avatar-placeholder svg { width: 22px; height: 22px; }
    .avatar-placeholder span {
      font-size: 0.58rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: 'Share Tech Mono', monospace;
    }

    /* ── Avatar lightbox overlay ── */
    #avatar-overlay {
      position: fixed;
      inset: 0;
      z-index: 8888;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    #avatar-overlay.open {
      opacity: 1;
      pointer-events: all;
    }
    #avatar-overlay-bg {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    #avatar-overlay-img {
      position: relative;
      z-index: 1;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid rgba(255,255,255,0.2);
      box-shadow: 0 0 60px rgba(191,0,255,0.3), 0 0 120px rgba(0,0,0,0.8);
      transform: scale(0.3);
      transform-origin: center center;
      transition: transform 0.45s cubic-bezier(0.22,1,0.36,1);
    }
    #avatar-overlay.open #avatar-overlay-img {
      transform: scale(1);
    }

    /* ══════════════════════════════════════
       NAME  (hover detail)
    ══════════════════════════════════════ */
    @keyframes neonFlicker {
      0%, 90%, 94%, 97%, 100% {
        color: #fff;
        text-shadow:
          0 0 6px #fff,
          0 0 20px #bf00ff,
          0 0 45px #bf00ff,
          0 0 90px #bf00ff;
      }
      91%, 95%, 96% {
        color: rgba(255,255,255,0.55);
        text-shadow: none;
      }
    }

    @keyframes iconGlow {
      0%, 100% { filter: drop-shadow(0 0 4px currentColor) drop-shadow(0 0 10px currentColor); }
      50%       { filter: drop-shadow(0 0 8px currentColor) drop-shadow(0 0 20px currentColor); }
    }

    .name {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.6rem;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
      cursor: default;
      animation: fadeUp 0.55s 0.12s cubic-bezier(0.22,1,0.36,1) both, neonFlicker 7s ease-in-out 1.2s infinite;
      transition: letter-spacing 0.3s ease;
    }
    .name:hover {
      letter-spacing: 0.18em;
      text-shadow:
        0 0 8px #fff,
        0 0 25px #bf00ff,
        0 0 55px #bf00ff;
    }

    /* ══════════════════════════════════════
       BIO
    ══════════════════════════════════════ */
    .bio {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
      max-width: 300px;
      margin-bottom: 34px;
      font-weight: 300;
      letter-spacing: 0.02em;
      animation: fadeUp 0.55s 0.18s cubic-bezier(0.22,1,0.36,1) both;
    }

    /* ══════════════════════════════════════
       SOCIALS
    ══════════════════════════════════════ */
    .socials {
      display: flex;
      flex-direction: row;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      animation: fadeUp 0.55s 0.30s cubic-bezier(0.22,1,0.36,1) both;
    }

    .social-link {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border: 1px solid var(--border);
      transition: border-color 0.22s, transform 0.22s, box-shadow 0.22s;
    }
    .social-link svg {
      width: 22px;
      height: 22px;
      animation: iconGlow 3s ease-in-out infinite;
    }
    .social-link:nth-child(1) svg { color: #c7d5e0; animation-delay: 0s; }
    .social-link:nth-child(2) svg { color: #1DB954; animation-delay: 0.4s; }
    .social-link:nth-child(3) svg { color: #5865F2; animation-delay: 0.8s; }
    .social-link:nth-child(4) svg { color: #e8e8e8; animation-delay: 1.2s; }
    .social-link:nth-child(5) svg { color: #FFC107; animation-delay: 1.6s; }
    .social-link:nth-child(6) svg { color: #4caf50; animation-delay: 2.0s; }
    .social-link:nth-child(7) svg { color: #bf00ff; animation-delay: 2.4s; }
    .social-link:hover {
      border-color: var(--border-hover);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }

    /* ══════════════════════════════════════
       MUSIC PLAYER
    ══════════════════════════════════════ */
    .music-player {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 280px;
      background: rgba(10,10,10,0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 12px 16px;
      backdrop-filter: blur(12px);
      z-index: 100;
      animation: fadeUp 0.55s 0.7s cubic-bezier(0.22,1,0.36,1) both;
    }

    .music-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .music-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      transition: background 0.2s;
      user-select: none;
    }
    .music-icon:hover { background: rgba(255,255,255,0.1); }
    .music-icon svg { width: 16px; height: 16px; fill: #aaa; transition: fill 0.2s; }
    .music-icon:hover svg { fill: #fff; }
    .music-icon.playing svg { fill: #bf00ff; filter: drop-shadow(0 0 4px #bf00ff); }

    .music-info { flex: 1; min-width: 0; }
    .music-title {
      font-size: 0.75rem;
      font-family: 'Share Tech Mono', monospace;
      color: #ccc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .music-sub {
      font-size: 0.62rem;
      color: var(--muted);
      margin-top: 1px;
      font-family: 'Share Tech Mono', monospace;
    }

    /* Volume row */
    .music-vol {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .music-vol svg { width: 13px; height: 13px; fill: #444; flex-shrink: 0; }

    .vol-slider {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.08);
      outline: none;
      cursor: pointer;
    }
    .vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #bf00ff;
      box-shadow: 0 0 6px #bf00ff;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .vol-slider::-webkit-slider-thumb:hover { transform: scale(1.3); }
    .vol-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #bf00ff;
      box-shadow: 0 0 6px #bf00ff;
      border: none;
      cursor: pointer;
    }

    /* waves */
    .music-waves {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 14px;
      flex-shrink: 0;
    }
    .music-waves span {
      width: 2px;
      border-radius: 1px;
      background: #bf00ff;
      box-shadow: 0 0 4px #bf00ff;
      animation: wave 0.8s ease-in-out infinite;
    }
    .music-waves span:nth-child(1) { height: 5px;  animation-delay: 0s; }
    .music-waves span:nth-child(2) { height: 10px; animation-delay: 0.15s; }
    .music-waves span:nth-child(3) { height: 7px;  animation-delay: 0.3s; }
    .music-waves span:nth-child(4) { height: 12px; animation-delay: 0.45s; }
    .music-waves span:nth-child(5) { height: 4px;  animation-delay: 0.6s; }
    .music-waves.paused span { animation-play-state: paused; }

    @keyframes wave {
      0%, 100% { transform: scaleY(1); }
      50%       { transform: scaleY(0.3); }
    }

    /* ══════════════════════════════════════
       FOOTER
    ══════════════════════════════════════ */
    .footer {
      margin-top: 32px;
      font-size: 0.62rem;
      font-family: 'Share Tech Mono', monospace;
      color: #222;
      letter-spacing: 0.06em;
      animation: fadeUp 0.55s 0.65s both;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .footer a { color: #333; text-decoration: none; transition: color 0.2s; }
    .footer a:hover { color: #555; }

    /* ══════════════════════════════════════
       RESPONSIVE — MOBILE
    ══════════════════════════════════════ */
    @media (max-width: 480px) {
      html, body {
        padding: 32px 12px;
        align-items: flex-start;
      }

      .card {
        max-width: 100%;
        padding-top: 16px;
      }

      .avatar-wrap {
        width: 88px;
        height: 88px;
      }

      .name { font-size: 1.35rem; }

      .bio {
        font-size: 0.75rem;
        max-width: 100%;
        margin-bottom: 28px;
      }

      .socials { gap: 10px; }

      .social-link {
        width: 44px;
        height: 44px;
        border-radius: 10px;
      }

      .music-player {
        bottom: 0;
        right: 0;
        left: 0;
        width: 100%;
        border-radius: 16px 16px 0 0;
        border-bottom: none;
      }

      #avatar-overlay-img {
        width: 220px;
        height: 220px;
      }
    }
  </style>
</head>

<!-- Music Player -->
<div class="music-player">
  <div class="music-top">
    <div class="music-icon" id="prev-btn" title="Anterior">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
    </div>

    <div class="music-icon" id="play-btn" title="Play / Pause">
      <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>

    <div class="music-icon" id="next-btn" title="Siguiente">
      <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zm2.5-6 5.5 3.9V8.1L8.5 12zM16 6h2v12h-2z"/></svg>
    </div>

    <div class="music-info">
      <div class="music-title" id="music-title">cargando…</div>
      <div class="music-sub" id="music-sub">♪ background music</div>
    </div>
    <div class="music-waves paused" id="music-waves">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>
  <div class="music-vol">
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
    <input type="range" class="vol-slider" id="vol-slider" min="0" max="1" step="0.01" value="0.5"/>
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM18.5 12c0-3.07-1.68-5.64-4.5-6.32v1.06c2.09.68 3.5 2.64 3.5 5.26s-1.41 4.58-3.5 5.26v1.06c2.82-.68 4.5-3.25 4.5-6.32z"/></svg>
  </div>
</div>

<audio id="bg-audio"></audio>

<script>
  // ═══════════════════════════════════════════════════════════
  // ▌ CONFIGURACIÓN — edita estos valores
  // ═══════════════════════════════════════════════════════════

  // Foto de avatar
  const AVATAR_URL = 'pfpicon.jpg';

  // Playlist: añade o quita canciones aquí
  // Coloca al final las 2 canciones pedidas (o las que tengas):
  const PLAYLIST = [
    { src: 'nuts.mp3',   title: 'nuts' },
    { src: 'Mira que linda.mp3',  title: 'poperulim' },   // ← cambia por tu 2ª canción
  ];

  // Fondo (video o imagen)
  const BACKGROUND_URL = 'background.mp4';

  // Cursor personalizado
  const CURSOR_URL = 'pointer.png';

  // ═══════════════════════════════════════════════════════════

  // ── Helpers ──────────────────────────────────────────────
  function isVideoFile(url) {
    if (!url) return false;
    const ext = url.toLowerCase().split('.').pop().split('?')[0];
    return ['mp4','webm','ogg','m4v','mov'].includes(ext);
  }

  // ── Background ───────────────────────────────────────────
  const bgVideo = document.getElementById('bg-video');
  if (BACKGROUND_URL) {
    if (isVideoFile(BACKGROUND_URL)) {
      bgVideo.src = BACKGROUND_URL;
      bgVideo.classList.remove('hidden');
    } else {
      bgVideo.classList.add('hidden');
      document.body.style.backgroundImage = `url('${BACKGROUND_URL}')`;
    }
  }

  // ── Cursor ───────────────────────────────────────────────
  if (CURSOR_URL) {
    document.documentElement.style.cursor = `url('${CURSOR_URL}'), auto`;
  }

  // ── Avatar setup ─────────────────────────────────────────
  const avatarImg         = document.getElementById('avatar-img');
  const avatarPlaceholder = document.getElementById('avatar-placeholder');
  const avatarWrap        = document.getElementById('avatar-wrap');
  const overlay           = document.getElementById('avatar-overlay');
  const overlayBg         = document.getElementById('avatar-overlay-bg');
  const overlayImg        = document.getElementById('avatar-overlay-img');

  let avatarSrc = '';

  function setAvatar(src) {
    avatarSrc = src;
    avatarImg.src = src;
    avatarImg.style.display = 'block';
    avatarPlaceholder.style.display = 'none';
    overlayImg.src = src;
  }

  if (AVATAR_URL) setAvatar(AVATAR_URL);

  // Click avatar → open lightbox (only if there's an image)
  avatarWrap.addEventListener('click', () => {
    if (!avatarSrc) return;

    // Calculate origin from avatar position for the scale transform-origin
    const rect = avatarWrap.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    overlayImg.style.transformOrigin = `center center`;

    overlay.classList.add('open');
  });

  // Click outside image (on bg) → close
  overlayBg.addEventListener('click', () => overlay.classList.remove('open'));

  // ── Music Player ─────────────────────────────────────────
  const audio     = document.getElementById('bg-audio');
  const playBtn   = document.getElementById('play-btn');
  const playIcon  = document.getElementById('play-icon');
  const waves     = document.getElementById('music-waves');
  const titleEl   = document.getElementById('music-title');
  const subEl     = document.getElementById('music-sub');
  const volSlider = document.getElementById('vol-slider');

  const iconPlay  = '<path d="M8 5v14l11-7z"/>';
  const iconPause = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

  let currentTrack = 0;
  let isPlaying    = false;

  audio.volume = 0.5;

  function setPlaying(state) {
    isPlaying = state;
    playIcon.innerHTML = state ? iconPause : iconPlay;
    playBtn.classList.toggle('playing', state);
    waves.classList.toggle('paused', !state);
  }

  function loadTrack(index, autoplay) {
    const track = PLAYLIST[index];
    if (!track) return;
    audio.src = track.src;
    titleEl.textContent = track.title;
    subEl.textContent   = `♪ ${index + 1} / ${PLAYLIST.length}`;
    if (autoplay) {
      audio.play().then(() => setPlaying(true)).catch(() => setPlaying(false));
    } else {
      setPlaying(false);
    }
  }

  // Init first track (no autoplay yet — starts on splash click)
  if (PLAYLIST.length > 0) loadTrack(0, false);

  // Play / Pause
  playBtn.addEventListener('click', () => {
    if (audio.paused) {
      audio.play().then(() => setPlaying(true)).catch(() => {});
    } else {
      audio.pause();
      setPlaying(false);
    }
  });

  // Next
  document.getElementById('next-btn').addEventListener('click', () => {
    currentTrack = (currentTrack + 1) % PLAYLIST.length;
    loadTrack(currentTrack, true);
  });

  // Previous
  document.getElementById('prev-btn').addEventListener('click', () => {
    // If more than 3 seconds in, restart current; otherwise go back
    if (audio.currentTime > 3) {
      audio.currentTime = 0;
      audio.play().then(() => setPlaying(true)).catch(() => {});
    } else {
      currentTrack = (currentTrack - 1 + PLAYLIST.length) % PLAYLIST.length;
      loadTrack(currentTrack, true);
    }
  });

  // Auto-advance when track ends
  audio.addEventListener('ended', () => {
    currentTrack = (currentTrack + 1) % PLAYLIST.length;
    loadTrack(currentTrack, true);
  });

  // Volume slider
  function updateVolSlider() {
    const pct = volSlider.value * 100;
    volSlider.style.background =
      `linear-gradient(to right, #bf00ff ${pct}%, rgba(255,255,255,0.08) ${pct}%)`;
    audio.volume = parseFloat(volSlider.value);
  }
  volSlider.addEventListener('input', updateVolSlider);
  updateVolSlider();

  // ── Splash → start music ──────────────────────────────────
  const splash = document.getElementById('splash');
  splash.addEventListener('click', () => {
    splash.classList.add('hide');
    setTimeout(() => splash.remove(), 800);

    // Start music after user interaction (required by browsers)
    if (PLAYLIST.length > 0) {
      audio.play().then(() => setPlaying(true)).catch(() => {});
    }
  });
</script>
</body>
